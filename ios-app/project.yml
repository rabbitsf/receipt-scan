name: ReceiptTracker
options:
  bundleIdPrefix: com.webreceipt
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
packages:
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS
    from: 7.1.0
targets:
  ReceiptTracker:
    type: application
    platform: iOS
    sources:
      - path: ReceiptTracker
        excludes:
          - WebApp
      # Built React web app served by Web Access over Wi-Fi. Generated by
      # `npm run build:ios-web` at the repo root — never edit by hand.
      - path: ReceiptTracker/WebApp
        type: folder
        buildPhase: resources
    dependencies:
      - package: GoogleSignIn
        product: GoogleSignIn
    info:
      path: ReceiptTracker/Info.plist
      properties:
        UILaunchScreen: {}
        NSCameraUsageDescription: "Receipt Tracker uses the camera to photograph receipts so their details can be scanned automatically."
        NSLocalNetworkUsageDescription: "Receipt Tracker uses your local network so a computer on the same Wi-Fi can open the receipt web app when Web Access is turned on."
        NSPhotoLibraryAddUsageDescription: "Receipt Tracker can save a receipt photo to your Photos library when you choose Save to Photos."
        # TODO(setup): replace with the real iOS OAuth Client ID from Google
        # Cloud Console (APIs & Services > Credentials > Create Credentials >
        # OAuth client ID > iOS, bundle ID com.webreceipt.ReceiptTracker).
        # Sign-in/upload will not work until this is a real value.
        GIDClientID: "451782245335-pjrcdkeij2e9nibofm3ne0uh9j0kbc2h.apps.googleusercontent.com"
        CFBundleURLTypes:
          - CFBundleURLSchemes:
              # TODO(setup): replace with the REVERSED_CLIENT_ID shown in the
              # same Google Cloud Console credential (or in the
              # GoogleService-Info.plist if downloaded) — this is the OAuth
              # redirect URL scheme, distinct from GIDClientID above.
              - "com.googleusercontent.apps.451782245335-pjrcdkeij2e9nibofm3ne0uh9j0kbc2h"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.webreceipt.ReceiptTracker
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: true
  ReceiptTrackerUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: ReceiptTrackerUITests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.webreceipt.ReceiptTrackerUITests
        GENERATE_INFOPLIST_FILE: true
        TEST_TARGET_NAME: ReceiptTracker
    dependencies:
      - target: ReceiptTracker
  ReceiptTrackerTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: ReceiptTrackerTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.webreceipt.ReceiptTrackerTests
        GENERATE_INFOPLIST_FILE: true
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/ReceiptTracker.app/ReceiptTracker"
        BUNDLE_LOADER: "$(TEST_HOST)"
    dependencies:
      - target: ReceiptTracker
schemes:
  ReceiptTracker:
    build:
      targets:
        ReceiptTracker: all
        ReceiptTrackerUITests: [test]
        ReceiptTrackerTests: [test]
    test:
      targets:
        - ReceiptTrackerUITests
        - ReceiptTrackerTests
